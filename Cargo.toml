[package]
name = "recurio"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
argon2 = "0.5.1"
async-trait = "0.1.73"
axum = { version = "0.8", features = ["tracing", "macros"] }
# axum-login 0.18 supports axum 0.7 and tower-sessions
axum-login = { version = "0.18" }
async-session = { version = "3" }
anyhow = "1"
chrono = { version = "0.4.26", features = ["serde"] }
config = "0.13.3"
iso_currency = { version = "0.4.4", features = ["serde", "with-serde"] }
secrecy = { version = "0.8.0", features = ["serde"] }
serde = { version = "1.0.188", features = ["derive"] }
serde-aux = "4.2.0"
serde_json = "1.0.105"
sqlx = { version = "0.7.1", features = ["runtime-tokio-rustls", "any", "postgres", "chrono", "uuid"] }
tokio = { version = "1.32.0", features = ["macros", "rt-multi-thread"] }
tower = "0.4.13"
tower-http = { version = "0.6", features = ["trace"] }
tower-sessions = { version = "0.14", features = ["memory-store"] }
# tower-sessions can be added later if we migrate from custom store
tracing = "0.1.37"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
unicode-segmentation = "1.10.1"
uuid = { version = "1.4.1", features = ["serde", "v4"] }

[dev-dependencies]
claims = "0.7.1"
fake = "2.8.0"
